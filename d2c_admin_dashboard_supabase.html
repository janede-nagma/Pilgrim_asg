<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D2C Admin Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"></head><body><style>/* Layout: fixed left rail + scrolling workspace. Header (title, metric switch, filters) -> page content.
   Detail pages (state, channel, product, customer) nest under their parent page with a breadcrumb. */
:root{
  --bg:#0a0807;--panel:#14100d;--panel2:#1b1612;--panel3:#241d17;--line:#2c241d;--line2:#3a3027;
  --ink:#f6efe7;--ink2:#cfc4b8;--mute:#93887c;--acc:#ff6a1a;--acc2:#ffa062;--acc3:#ffd3ae;--accdim:rgba(255,106,26,.14);
  --good:#4cc38a;--warn:#f2b83b;--crit:#ff5d5d;--info:#6aa9ff;
  --c-app:#d95926;--c-ins:#3987e5;--c-web:#199e70;--c-wa:#c98500;--c-amz:#d55181;
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body{padding-inline:16px;padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc2)}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:16px;max-width:1560px;margin:0 auto;align-items:start}
.rail{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-family:var(--f-disp);font-weight:800;letter-spacing:.14em;font-size:15px}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#1a0b02;font-style:normal;font-weight:800;letter-spacing:0;font-size:17px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);cursor:pointer;font-weight:600;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--panel3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.nav button[aria-current="page"] svg{stroke:var(--acc)}
.nav button:focus-visible,.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--accdim);color:var(--acc2);padding:1px 7px;border-radius:99px}
.wb{margin-top:auto;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.wb b{font-family:var(--f-disp);font-size:13px}
.wb small{color:var(--mute);font-size:11.5px;line-height:1.4}
.wb .pill{align-self:flex-start;margin-top:4px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:6px 4px 0}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.ttl h1 em{font-style:normal;color:var(--acc)}
.ttl p{margin:0;color:var(--mute);font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mute);font-size:12.5px;margin-bottom:4px}
.crumbs button{all:unset;cursor:pointer;color:var(--acc2);font-weight:600}
.crumbs button:hover{text-decoration:underline}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 12px;border-radius:9px;color:var(--ink2);font-size:12.5px;font-weight:600}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--acc);color:#1a0b02}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600;font-size:12.5px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.on{border-color:var(--acc);color:var(--acc2)}
.btn .n{font-family:var(--f-mono);background:var(--acc);color:#1a0b02;border-radius:99px;font-size:11px;padding:0 6px}
.fpanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.fpanel h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--accdim);border-color:var(--acc);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-size:12.5px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gmap{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card.alt{background:var(--panel2)}
.card h3{margin:0;font-family:var(--f-disp);font-size:16px;font-weight:700;letter-spacing:.01em}
.card .sub{color:var(--mute);font-size:12.5px;margin:2px 0 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.kpi.hero{background:linear-gradient(160deg,#2a160a,var(--panel) 70%);border-color:#5b2c10}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi .v{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi.hero .v{color:var(--acc2)}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi svg{margin-top:6px;width:100%;height:30px;display:block}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}
.hb[data-go]{cursor:pointer}
.hb[data-go]:hover{background:var(--panel2)}
.hb .l{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.hb .l small{color:var(--mute);font-weight:500}
.hb .t{height:10px;background:var(--panel3);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px}
.hb .v{font-family:var(--f-mono);font-size:12.5px;text-align:right;min-width:62px;color:var(--ink)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;background:var(--bg)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--mute)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .lnk{all:unset;cursor:pointer;color:var(--ink);font-weight:600}
td .lnk:hover{color:var(--acc2);text-decoration:underline}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.pos{color:var(--good)}.neg{color:var(--crit)}.neu{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--panel3);color:var(--ink2);white-space:nowrap}
.pill.good{background:rgba(76,195,138,.14);color:var(--good)}
.pill.warn{background:rgba(242,184,59,.14);color:var(--warn)}
.pill.crit{background:rgba(255,93,93,.14);color:var(--crit)}
.pill.info{background:rgba(106,169,255,.14);color:var(--info)}
.pill.acc{background:var(--accdim);color:var(--acc2)}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:13px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.ins .sev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--f-disp)}
.ins.crit .sev{background:rgba(255,93,93,.16);color:var(--crit)}
.ins.warn .sev{background:rgba(242,184,59,.16);color:var(--warn)}
.ins.good .sev{background:rgba(76,195,138,.16);color:var(--good)}
.ins.info .sev{background:rgba(106,169,255,.16);color:var(--info)}
.ins h5{margin:0 0 3px;font-size:13.5px;font-family:var(--f-disp);font-weight:700}
.ins p{margin:0;color:var(--ink2);font-size:13px}
.ins .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.ins .acts button,.mini{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;font-weight:700;color:var(--acc2);border:1px solid var(--line2);border-radius:8px;padding:3px 9px}
.ins .acts button:hover,.mini:hover{background:var(--accdim);border-color:var(--acc)}
.feed{display:flex;flex-direction:column;gap:10px}
.mapwrap{position:relative;background:radial-gradient(ellipse at 40% 35%,#1d1510,var(--panel) 70%);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;max-height:76vh}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-size:17px;font-weight:700}
.mapctl button:hover{border-color:var(--acc)}
.maplegend{position:absolute;left:14px;bottom:14px;background:rgba(10,8,7,.82);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:190px;backdrop-filter:blur(4px)}
.maplegend .bar{height:9px;border-radius:99px;margin:6px 0 4px}
.maplegend div.r{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.maplegend small{font-size:11px;color:var(--mute)}
.st{transition:fill .25s,stroke .15s}
.st.hasd{cursor:pointer}
.st.hasd:hover{stroke:var(--acc3);stroke-width:1.6}
.cb{cursor:pointer}
.cb:hover{stroke:#fff}
#tip{position:fixed;z-index:50;pointer-events:none;background:#000;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:12.5px;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .08s}
#tip b{display:block;font-family:var(--f-disp);font-size:13.5px;margin-bottom:3px}
#tip .row{display:flex;justify-content:space-between;gap:18px;color:var(--ink2)}
#tip .row span:last-child{font-family:var(--f-mono);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);color:#1a0b02;padding:9px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.heat{display:grid;gap:4px;font-size:12px}
.heat .c{padding:9px 6px;border-radius:8px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:0}
.heat .h{color:var(--mute);font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px}
.heat .rl{text-align:left;justify-content:flex-start;font-family:var(--f-body);font-weight:600;color:var(--ink2);display:flex;align-items:center;padding-left:2px}
.sim{display:grid;gap:14px}
.sim label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:600}
.sim label span b{font-family:var(--f-mono);color:var(--acc2)}
input[type=range]{accent-color:var(--acc);width:100%}
.out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.out div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
.out small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.out b{font-family:var(--f-disp);font-size:20px}
input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:8px 12px;font:inherit;min-width:220px}
input[type=search]:focus{outline:2px solid var(--acc2)}
.er{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sheet{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sheet b{font-family:var(--f-disp)}
.sheet small{color:var(--mute);font-size:12px}
.rel{display:grid;grid-template-columns:1fr 104px 1fr;align-items:center;gap:8px;font-size:12.5px}
.rel .bx{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px;text-align:center}
.rel .ar{text-align:center;color:var(--acc2);font-family:var(--f-mono);font-size:11px}
.hid{display:grid;gap:10px}
.hid .ins p b{color:var(--ink)}
.empty{padding:34px 12px;text-align:center;color:var(--mute)}
.minimap svg{width:100%;height:auto;max-height:300px;display:block}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.gmap{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:column;min-height:0;padding:12px;border-radius:18px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .nav button{white-space:nowrap}
  .wb{display:none}
  .g2e,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ttl h1{font-size:24px}
  .hb{grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto}
  .out{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld>label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.fld select,.fld input[type=date],.fld input[type=number],.fld input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;width:100%;min-width:0}
.fld input:focus,.fld select:focus{outline:2px solid var(--acc2);outline-offset:1px}
.hint{font-size:12px;color:var(--mute)}
.err{font-size:12px;color:var(--crit);font-weight:600}
.btn.pri{background:var(--acc);color:#1a0b02;border-color:var(--acc);font-weight:800}
.btn.pri:hover{background:var(--acc2)}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}

.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(5,3,2,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.modal{width:min(780px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-family:var(--f-disp);font-size:18px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.chip .cnt{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.mini.danger{color:var(--crit);border-color:rgba(255,93,93,.4)}
.mini.danger:hover{background:rgba(255,93,93,.12);border-color:var(--crit)}

.modal.ed{width:min(640px,100%)}
.fld input:disabled,.fld select:disabled{opacity:.55;cursor:not-allowed}
.fld .form{gap:10px}
.fld input[type=number]{font-family:var(--f-mono)}

function loadData(s){ORD.length=0;CUST.length=0;D.catalog.length=0;D.pricing.length=0;s.ord.forEach(x=>ORD.push({...x}));s.cust.forEach(x=>CUST.push({...x}));s.catalog.forEach(x=>D.catalog.push({...x}));s.pricing.forEach(x=>D.pricing.push({...x}))}
function derive(b){
  const c=D.catalog.find(x=>x.product_name===b.prod)||{},u=CUST.find(x=>x.customer_id===b.cust)||{},p=D.pricing.find(x=>x.product_name===b.prod&&x.channel===b.ch);
  return enrich({id:b.id,date:b.date,cust:b.cust,name:u.customer_name||b.cust,city:b.city,state:CITY[b.city]||'',cat:c.category||'',prod:b.prod,qty:+b.qty||0,ch:b.ch,mrp:c.mrp||0,disc:p?p.discount_pct:0,cost:c.cost_price||0,brand:c.brand||'',hero:c.is_hero_product||'N',seg:u.customer_segment||'',acq:u.acquisition_channel||'',loy:u.is_loyalty_member||'N',reg:u.registration_date||'',shelf:c.shelf_life_days||0,isNew:!!b.isNew})}
function syncLists(){
  const chs=[...new Set(D.pricing.map(p=>p.channel))],cts=[...new Set(D.catalog.map(p=>p.category))];
  CHS.length=0;CHS.push(...BASE_CH.filter(c=>chs.includes(c)),...chs.filter(c=>!BASE_CH.includes(c)));
  CATS.length=0;CATS.push(...BASE_CAT.filter(c=>cts.includes(c)),...cts.filter(c=>!BASE_CAT.includes(c)));
  CHS.forEach(c=>{if(!CHC[c])CHC[c]=XCOL[xn++%XCOL.length]});CATS.forEach(c=>catColor(c))}
function rebuild(){syncLists();O.length=0;ORD.forEach(b=>O.push(derive(b)))}
function saveEntries(){if(SB.state==='online'){syncCloud();return}try{localStorage.setItem(LSK,JSON.stringify({ord:ORD,cust:CUST,catalog:D.catalog,pricing:D.pricing}))}catch(_){}}

async function cloudInit(){
  const cfg=sbCfg();
  if(!cfg.url||!cfg.key){SB.state='off';render();return}
  if(!window.supabase||!window.supabase.createClient){SB.state='error';SB.msg='Supabase library did not load. Check your internet connection.';render();return}
  try{sb=window.supabase.createClient(cfg.url,cfg.key);SB.state='connecting';render();
    const {data,error}=await sb.auth.getSession();if(error)throw error;
    if(!data.session){SB.state='signin';render();return}
    SB.user=data.session.user.email;await cloudLoad()}
  catch(e){SB.state='error';SB.msg=e.message||String(e);render()}}
async function cloudLoad(){
  SB.state='connecting';render();
  try{
    const q=(t,o)=>sb.from(t).select('*').order(o).range(0,9999);
    const [u,c,p,o]=await Promise.all([q('customers','customer_id'),q('product_catalog','id'),q('product_pricing','id'),q('orders','order_id')]);
    for(const r of [u,c,p,o])if(r.error)throw r.error;
    SB.empty=!c.data.length;
    if(SB.empty){loadData(JSON.parse(ORIG));SNAP=emptySnap()}
    else{loadData({ord:o.data.map(CT.orders.from),cust:u.data.map(CT.customers.from),catalog:c.data.map(CT.catalog.from),pricing:p.data.map(CT.pricing.from)})}
    rebuild();if(!SB.empty)SNAP=takeSnap();
    EDIT=null;lastAdded=null;SB.state='online';SB.saved=true;SB.err=''}
  catch(e){SB.state='error';SB.msg=e.message||String(e)}
  render()}
async function syncCloud(){
  if(SB.state!=='online'||!sb)return;
  if(SB.busy){SB.again=true;return}
  SB.busy=true;SB.saved=false;SB.err='';sbPaint();
  try{
    for(const k of ['orders','pricing','catalog','customers']){ // deletes: children first
      const c=CT[k],have=new Set(c.rows().map(c.key).filter(x=>x!=null)),gone=[...SNAP[k].keys()].filter(id=>!have.has(id));
      if(gone.length){const {error}=await sb.from(c.t).delete().in(c.pk,gone);if(error)throw error;gone.forEach(id=>SNAP[k].delete(id))}}
    for(const k of ['customers','catalog','pricing','orders']){ // upserts: parents first
      const c=CT[k],fresh=[],chg=[];
      c.rows().forEach(x=>{const id=c.key(x);if(id==null)fresh.push(x);else if(SNAP[k].get(id)!==JSON.stringify(c.to(x)))chg.push(x)});
      if(c.sur){
        if(chg.length){const {error}=await sb.from(c.t).upsert(chg.map(x=>({id:c.key(x),...c.to(x)})),{onConflict:'id'});if(error)throw error;chg.forEach(x=>SNAP[k].set(c.key(x),JSON.stringify(c.to(x))))}
        if(fresh.length){const {data,error}=await sb.from(c.t).insert(fresh.map(c.to)).select('id,'+c.natCols);if(error)throw error;
          fresh.forEach(x=>{const r=data.find(d=>c.nat(d)===c.nat(x));if(r){x._id=r.id;SNAP[k].set(r.id,JSON.stringify(c.to(x)))}})}}
      else{const all=[...chg,...fresh];for(let i=0;i<all.length;i+=500){const {error}=await sb.from(c.t).upsert(all.slice(i,i+500).map(c.to),{onConflict:c.pk});if(error)throw error}
        all.forEach(x=>SNAP[k].set(c.key(x),JSON.stringify(c.to(x))))}}
    SB.saved=true;SB.empty=false}
  catch(e){SB.err=(e&&e.message)||String(e);toast('Cloud save failed: '+SB.err,4500)}
  SB.busy=false;sbPaint();
  if(SB.again){SB.again=false;syncCloud()}}

    hits+=`<rect x="${l+i*bw}" y="${t}" width="${bw}" height="${ih+8}" fill="transparent" data-act="month:${i}" style="cursor:pointer" ${tipA(`<b>${MON[i]} 2024</b><div class="row"><span>Revenue</span><span>${inr(tt.net)}</span></div><div class="row"><span>Orders</span><span>${tt.orders}</span></div><div class="row"><span>Units</span><span>${tt.units}</span></div><div class="row"><span>Profit</span><span>${inr(tt.profit)}</span></div><div class="row"><span>Click</span><span>focus month</span></div>`)}/>`});
  const ma=vals.map((_,i)=>{const s=vals.slice(Math.max(0,i-2),i+1);return s.reduce((a,c)=>a+c,0)/s.length});
  const ml='M'+ma.map((v,i)=>(l+i*bw+bw/2).toFixed(1)+','+y(v).toFixed(1)).join('L');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly ${METRICS[M].label} bar chart" style="width:100%;height:auto;display:block">${g}${bars}<path d="${ml}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>${xl}${hits}</svg>`}

/* ---------- map ---------- */
const RAMP=[[0,[62,36,22]],[.45,[196,76,14]],[.8,[255,122,36]],[1,[255,196,140]]];
function ramp(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<RAMP.length;i++){if(t<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i],u=(t-a[0])/(b[0]-a[0]);return 'rgb('+a[1].map((c,j)=>Math.round(c+(b[1][j]-c)*u)).join(',')+')'}}return 'rgb(255,196,140)'}
const RAMPCSS='linear-gradient(90deg,rgb(62,36,22),rgb(196,76,14) 45%,rgb(255,122,36) 80%,rgb(255,196,140))';
let VIEW={x:0,y:0,w:MAPD.W,h:MAPD.H};
const LBL={Mumbai:['end',-6,-8],Pune:['start',7,12],Ahmedabad:['end',-8,2],Jaipur:['end',-8,2],Delhi:['start',8,-6],Lucknow:['start',8,4],Kolkata:['start',8,4],Hyderabad:['start',8,4],Chennai:['start',8,6],Bengaluru:['end',-8,8]};
function mapSVG({sv,cv,mode='both',hl=null,mini=false}){
  const vals=[...sv.values()].map(x=>x.v),mx=Math.max(...vals,1e-9),mn=Math.min(...vals,0);
  let p='';
  for(const [nm,s] of Object.entries(MAPD.states)){
    const c=s.code,has=c&&sv.has(c);let fill='#17120f',stk='#2c241d';
    if(hl){if(c===hl)fill='var(--acc)'}
    else if(has&&mode!=='city'){fill=ramp(mx===mn?1:(sv.get(c).v-mn*0)/mx*.9+.1)}
    else if(has){fill='#241b14'}
    p+=`<path class="st ${has&&!mini?'hasd':''}" d="${s.d}" fill="${fill}" stroke="${stk}" stroke-width=".8" ${has&&!mini?`data-go="state-${c}" ${tipA(sv.get(c).tip)}`:''} ><title>${esc(nm)}</title></path>`}
  let cb='';
  if((mode!=='state'||hl)&&cv){
    const cm=Math.max(...[...cv.values()].map(x=>x.v),1e-9);
    for(const [c,xy] of Object.entries(MAPD.cities)){
      if(!cv.has(c))continue;const d=cv.get(c);if(hl&&d.state!==hl)continue;
      const r=(mini?7:6)+Math.sqrt(d.v/cm)*(mini?10:20),lb=LBL[c]||['start',8,4];
      cb+=`<g><circle class="cb" cx="${xy[0]}" cy="${xy[1]}" r="${r.toFixed(1)}" fill="rgba(255,106,26,.28)" stroke="var(--acc2)" stroke-width="1.5" ${mini?'':`data-go="city-${slug(c)}" ${tipA(d.tip)}`}/><circle cx="${xy[0]}" cy="${xy[1]}" r="2.6" fill="#fff" pointer-events="none"/>${mini?'':`<text x="${xy[0]+lb[1]}" y="${xy[1]+lb[2]}" text-anchor="${lb[0]}" fill="var(--ink)" font-size="10.5" font-weight="700" stroke="#0a0807" stroke-width="3" paint-order="stroke" pointer-events="none">${c}</text>`}</g>`}}
  const vb=mini?`0 0 ${MAPD.W} ${MAPD.H}`:`${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`;
  return `<svg id="${mini?'minisvg':'mapsvg'}" viewBox="${vb}" role="img" aria-label="India map shaded by ${METRICS[M].label}">${p}${cb}</svg>`}
function stateTip(g){return `<b>${STATE[g.k]}</b><div class="row"><span>Revenue</span><span>${inr(g.net)}</span></div><div class="row"><span>Orders</span><span>${g.orders}</span></div><div class="row"><span>Units</span><span>${g.units}</span></div><div class="row"><span>AOV</span><span>${inr(g.aov)}</span></div><div class="row"><span>Margin</span><span>${pct(g.margin)}</span></div><div class="row"><span>Click</span><span>open state page</span></div>`}
function cityTip(g){return `<b>${g.k}, ${g.rows[0].state}</b><div class="row"><span>Revenue</span><span>${inr(g.net)}</span></div><div class="row"><span>Orders</span><span>${g.orders}</span></div><div class="row"><span>AOV</span><span>${inr(g.aov)}</span></div><div class="row"><span>Margin</span><span>${pct(g.margin)}</span></div><div class="row"><span>Click</span><span>open city page</span></div>`}
function mapValues(rows){
  const sv=new Map(),cv=new Map();
  group(rows,o=>o.state).forEach(g=>sv.set(g.k,{v:mv(g),tip:stateTip(g)}));
  group(rows,o=>o.city).forEach(g=>cv.set(g.k,{v:mv(g),state:g.rows[0].state,tip:cityTip(g)}));
  return {sv,cv}}

/* ---------- orders table ---------- */
const COLS=[['id','Order',o=>`<span class="mono">#${o.id}</span>${o.isNew?' <span class="pill acc">NEW</span>':''}`],['date','Date',o=>o.date],['cust','Customer',o=>`<button class="lnk" data-go="customer-${o.cust}">${esc(o.name)}</button>`],['city','City',o=>`<button class="lnk" data-go="city-${slug(o.city)}">${o.city}</button>, ${o.state}`],['prod','Product',o=>`<button class="lnk" data-go="product-${slug(o.prod)}">${esc(o.prod)}</button>`],['ch','Channel',o=>`<button class="lnk" data-go="channel-${o.ch}">${chDot(o.ch)} ${o.ch}</button>`],['qty','Qty',o=>o.qty,1],['disc','Disc',o=>o.disc+'%',1],['net','Net revenue',o=>`<span class="mono">${inr(o.net)}</span>`,1],['profit','Profit',o=>`<span class="mono">${inr(o.profit)}</span>`,1]];
const RAWCOLS=[['id','Order',o=>`<span class="mono">#${o.id}</span>${o.isNew?' <span class="pill acc">NEW</span>':''}`],['date','Date',o=>o.date],['m','Month',o=>MON[o.m]],['cust','Customer ID',o=>`<span class="mono">${esc(o.cust)}</span>`],['city','City',o=>esc(o.city)],['state','State',o=>o.state],['cat','Category',o=>esc(o.cat)],['prod','Product',o=>esc(o.prod)],['qty','Qty',o=>o.qty,1],['ch','Channel',o=>`${chDot(o.ch)} ${o.ch}`],['mrp','MRP',o=>`<span class="mono">${inr(o.mrp)}</span>`,1]];
function ordersTable(rows,{sortable=false,limit=0,actions=false,cols=null}={}){
  let r=[...rows];const s=sortable?sortS:{col:'date',dir:-1};
  r.sort((a,b)=>(a[s.col]>b[s.col]?1:a[s.col]<b[s.col]?-1:0)*s.dir||(s.col==='m'?(a.date>b.date?1:a.date<b.date?-1:0)*s.dir:0)||b.id-a.id);
  const total=r.length;if(limit)r=r.slice(0,limit);
  const cs=cols||(sortable?[COLS[0],COLS[1],['m','Month',o=>MON[o.m]],...COLS.slice(2)]:COLS),n=cs.length+(actions?1:0);
  return `<div class="tablewrap"><table><thead><tr>${cs.map(c=>`<th class="${c[3]?'r':''}" ${sortable?`data-sort="${c[0]}"`:''}>${c[1]}${sortable&&s.col===c[0]?(s.dir>0?' ▲':' ▼'):''}</th>`).join('')}${actions?'<th></th>':''}</tr></thead><tbody>${r.map(o=>`<tr>${cs.map(c=>`<td class="${c[3]?'r':''}">${c[2](o)}</td>`).join('')}${actions?`<td>${rowActs('orders',o.id)}</td>`:''}</tr>`).join('')||`<tr><td colspan="${n}" class="empty">No orders match the current filters.</td></tr>`}</tbody></table></div>${limit&&total>limit?`<p class="sub" style="margin:10px 4px 0">Showing ${limit} of ${total}. <button class="mini" data-go="orders">Open order explorer</button></p>`:''}`}

/* ---------- insight engine ---------- */
function insights(rows){
  const out=[],T=tot(rows);if(rows.length<4)return out;
  const add=(sev,title,body,acts=[])=>out.push({sev,title,body,acts});
  const chg=group(rows,o=>o.ch).filter(g=>g.orders>=3);
  if(chg.length>1){const w=[...chg].sort((a,b)=>a.margin-b.margin)[0],best=[...chg].sort((a,b)=>b.margin-a.margin)[0],all=tot(rows);
    if(w.margin<best.margin-.02)add(w.avgDisc>.12?'crit':'warn',`${w.k} sells at the lowest margin`,`${w.k} carries a ${pct(w.avgDisc)} weighted discount and a ${pct(w.margin)} margin, against ${pct(best.margin)} on ${best.k}. It gives away ${inr(w.disc)} (${pct(w.disc/all.disc,0)} of all discounting) while delivering ${pct(w.net/T.net,0)} of revenue.`,[['Channel economics','channel-'+w.k],['Run discount simulator','channels']])}
  const sg=group(rows,o=>o.state).sort((a,b)=>b.net-a.net);
  if(sg.length>=3){const t3=sum(sg.slice(0,3),g=>g.net)/T.net;add(t3>.5?'warn':'info',`${STATE[sg[0].k]} leads, top 3 states hold ${pct(t3,0)}`,`${STATE[sg[0].k]} alone brings ${inr(sg[0].net)} (${pct(sg[0].net/T.net,0)}) from ${sg[0].orders} orders${sg[0].rows.every(o=>o.city===sg[0].rows[0].city)?`, all from ${sg[0].rows[0].city}`:''}. ${STATE[sg[1].k]} and ${STATE[sg[2].k]} follow. A change in one city moves the whole business.`,[['See the map','geo'],['State page','state-'+sg[0].k]])}
  const cg=group(rows,o=>o.city).filter(g=>g.orders<=2);
  if(cg.length){add('warn',`${cg.length} cit${cg.length>1?'ies':'y'} barely penetrated`,`${cg.map(g=>`${g.k} (${g.orders} order${g.orders>1?'s':''}, AOV ${inr(g.aov)})`).join(' and ')}. These are large metros with the thinnest order counts in the data, so they are the clearest white space.`,[['Geography','geo']])}
  const mg=group(rows,o=>o.m).sort((a,b)=>a.k-b.k);
  if(mg.length>=6){const pk=[...mg].sort((a,b)=>b.net-a.net)[0],tr=[...mg].sort((a,b)=>a.net-b.net)[0],h1=tot(rows.filter(o=>o.m<6)).net,h2=tot(rows.filter(o=>o.m>=6)).net;
    add(h2<h1*.85?'crit':'info',`Peak in ${MON[pk.k]}, trough in ${MON[tr.k]}${h1&&h2?`, H2 ${h2<h1?'down':'up'} ${pct(Math.abs(h2/h1-1),0)} on H1`:''}`,`${MON[pk.k]} delivered ${inr(pk.net)} (${pct(pk.net/T.net,0)} of revenue) from ${pk.orders} orders. ${MON[tr.k]} managed ${inr(tr.net)} from ${tr.orders}. H1 revenue was ${inr(h1)} against ${inr(h2)} in H2.`,[['Overview trend','overview']])}
  const lg=group(rows,o=>o.loy);const Y=lg.find(g=>g.k==='Y'),N=lg.find(g=>g.k==='N');
  if(Y&&N&&Y.orders>2&&N.orders>2)add(Y.aov<N.aov?'warn':'good',`Loyalty members order more often, not bigger`,`Members place ${pct(Y.orders/T.orders,0)} of orders and bring ${pct(Y.net/T.net,0)} of revenue, but their average order is ${inr(Y.aov)} against ${inr(N.aov)} for non-members (${pct(Y.aov/N.aov-1,0)}).`,[['Customers','customers']])
  const pg=group(rows,o=>o.prod).sort((a,b)=>b.net-a.net);
  if(pg.length>2){const small=pg.filter(g=>g.net/T.net<.02);add(pg[0].net/T.net>.15?'warn':'info',`${pg[0].k} is ${pct(pg[0].net/T.net,0)} of revenue`,`${pg[0].k} (${inr(pg[0].net)}) is the top product. ${small.length?`${small.length} product${small.length>1?'s':''} (${small.slice(0,3).map(g=>g.k).join(', ')}) each add under 2% of revenue.`:''}`,[['Product page','product-'+slug(pg[0].k)],['All products','products']])}
  const hero=tot(rows.filter(o=>o.hero==='Y')),non=tot(rows.filter(o=>o.hero!=='Y'));
  if(hero.orders&&non.orders)add('good','Hero products over-index on value',`Hero SKUs are ${pct(hero.orders/T.orders,0)} of orders and ${pct(hero.net/T.net,0)} of revenue. Average order ${inr(hero.aov)} versus ${inr(non.aov)} for the rest, at a ${pct(hero.margin)} margin versus ${pct(non.margin)}.`,[['Products','products']])
  const cu=group(rows,o=>o.cust).sort((a,b)=>b.net-a.net);
  if(cu.length>3){const t2=cu[0].net+cu[1].net;add(t2/T.net>.15?'warn':'info',`Two customers drive ${pct(t2/T.net,0)} of revenue`,`${cu[0].rows[0].name} (${inr(cu[0].net)}) and ${cu[1].rows[0].name} (${inr(cu[1].net)}) lead ${cu.length} active customers. Losing either would be visible.`,[['Customer page','customer-'+cu[0].k],['Customers','customers']])}
  const cat=group(rows,o=>o.cat).filter(g=>g.orders>=3).sort((a,b)=>a.margin-b.margin);
  if(cat.length>1)add('info',`${cat[0].k} has the thinnest margin (${pct(cat[0].margin)})`,`${cat[cat.length-1].k} earns ${pct(cat[cat.length-1].margin)}. Cost price runs ${rng(D.catalog.map(x=>x.cost_price/x.mrp),v=>pct(v,0))} of MRP across the catalog, so margin differences come from cost ratio plus channel discount.`,[['Category page','category-'+cat[0].k]])
  const cs=[...D.catalog].sort((a,b)=>a.mrp-b.mrp),lo=cs[0],nx=cs[1];
  if(lo&&nx&&lo.mrp<nx.mrp*.4){const fd=rows.filter(o=>o.prod===lo.product_name);
    if(fd.length)add('warn',`${lo.product_name} MRP looks like an outlier`,`${lo.product_name} is listed at ${inr(lo.mrp)}, while every other product sits between ${inr(nx.mrp)} and ${inr(cs[cs.length-1].mrp)}. It has produced ${inr(sum(fd,o=>o.net))} on ${fd.length} order${fd.length>1?'s':''}. Confirm the price is intentional.`,[['Product page','product-'+slug(lo.product_name)]])}
  return out}

const kpiRow=(rows,all)=>{const T=tot(rows);return `<div class="grid g6">${[

const rank=(rows,fn,{label=k=>k,go=null,color=null,dot=null,n=0}={})=>{let g=group(rows,fn).sort((a,b)=>mv(b)-mv(a));if(n)g=g.slice(0,n);

function stackShare(rows,fn,colors,order){const g=group(rows,fn),T=sum(g,x=>x.net)||1;const ord=order.filter(k=>g.find(x=>x.k===k)).map(k=>g.find(x=>x.k===k));

function heat(rowsKeys,colKeys,val,fmt,rowLabel,colLabel,zeroShow){

function simOut(sr){const cap=sim.cap,v=1+sim.vol/100;let n0=0,p0=0,n1=0,p1=0;sr.forEach(o=>{const d=Math.min(o.disc,cap);const nn=o.gross*(1-d/100);n0+=o.net;p0+=o.profit;n1+=nn*v;p1+=(nn-o.cogs)*v});

  if(i>0&&FIELD[h.slice(0,i)]){const type=h.slice(0,i),key=resolve(type,h.slice(i+1));if(key){route={page:PARENT[type],type,key};return}}
  route={page:PAGEFN[h]?h:'overview',type:null,key:null}}
window.addEventListener('hashchange',()=>{EDIT=null;parseHash();render(false);window.scrollTo(0,0)});

/* ---------- map pan / zoom ---------- */
function applyView(){const s=$('#mapsvg');if(s)s.setAttribute('viewBox',`${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`)}
let dragMoved=false;
function initMap(){const s=$('#mapsvg');if(!s)return;let sx,sy,vx,vy,on=false;
  s.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;on=true;dragMoved=false;sx=e.clientX;sy=e.clientY;vx=VIEW.x;vy=VIEW.y});
  window.addEventListener('pointermove',e=>{if(!on)return;const k=VIEW.w/s.clientWidth,dx=(e.clientX-sx),dy=(e.clientY-sy);if(Math.abs(dx)+Math.abs(dy)>4)dragMoved=true;VIEW.x=vx-dx*k;VIEW.y=vy-dy*k;applyView()});
  window.addEventListener('pointerup',()=>{on=false});
  s.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:.87,e)},{passive:false})}
function zoom(f,e){const s=$('#mapsvg');let px=.5,py=.5;if(e&&s){const r=s.getBoundingClientRect();px=(e.clientX-r.left)/r.width;py=(e.clientY-r.top)/r.height}
  const nw=Math.min(MAPD.W,Math.max(MAPD.W/6,VIEW.w*f)),nh=nw*MAPD.H/MAPD.W;VIEW.x+=(VIEW.w-nw)*px;VIEW.y+=(VIEW.h-nh)*py;VIEW.w=nw;VIEW.h=nh;applyView()}

/* ---------- events ---------- */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=TIPS[+t.dataset.tip]||'';tip.style.opacity=1});
document.addEventListener('mousemove',e=>{if(tip.style.opacity==0)return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=e.clientY-h-16;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
document.addEventListener('mouseleave',()=>{tip.style.opacity=0});
function toast(m,ms=1800){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,ms)}
function csv(rows){const hd=['order_id','order_date','customer_id','customer','city','state','category','product','channel','segment','quantity','MRP','discount_pct','net_revenue','profit'];return [hd.join(','),...rows.map(o=>[o.id,o.date,o.cust,'"'+o.name+'"',o.city,o.state,o.cat,'"'+o.prod+'"',o.ch,o.seg,o.qty,o.mrp,o.disc,o.net.toFixed(2),o.profit.toFixed(2)].join(','))].join('\n')}
document.addEventListener('click',e=>{
  if(dragMoved){dragMoved=false;if(e.target.closest('#mapsvg'))return}
  const t=e.target.closest('[data-go],[data-f],[data-m],[data-act],[data-sort]');if(!t)return;tip.style.opacity=0;
  if(t.dataset.go){const g=t.dataset.go;if(insOpen){insOpen=false;window.__insFocus=0;if(location.hash.slice(1)===g||(!location.hash&&g==='overview')){render();return}}go(g);return}
  if(t.dataset.m){M=t.dataset.m;render();return}
  if(t.dataset.sort){const c=t.dataset.sort,st=isOrdTab()?sortS:XS[TAB];Object.assign(st,st.col===c?{col:c,dir:-st.dir}:{col:c,dir:1});render();return}
  if(t.dataset.f){const [k,v]=t.dataset.f.split(':');if(k==='loy')F.loy=v;else if(k==='src')F.src=v;else F[k].has(v)?F[k].delete(v):F[k].add(v);render();return}
  const [a,v]=t.dataset.act.split(':');
  if(a==='insclose'&&t.classList.contains('modal-bg')&&e.target!==t)return;
  if(a==='filters'){fopen=!fopen;render()}
  else if(a==='insopen'){insOpen=true;render()}
  else if(a==='insclose'){insOpen=false;render()}
  else if(a==='reset'){OM='all';F.cat.clear();F.ch.clear();F.seg.clear();F.loy='all';F.src='all';F.m0=0;F.m1=11;F.q='';render()}
  else if(a==='month'){const i=+v;if(F.m0===i&&F.m1===i){F.m0=0;F.m1=11}else{F.m0=i;F.m1=i}render()}
  else if(a==='months'){F.m0=0;F.m1=11;render()}
  else if(a==='level'){G.level=v;render()}
  else if(a==='zoom'){if(v==='reset'){VIEW={x:0,y:0,w:MAPD.W,h:MAPD.H};applyView()}else zoom(+v)}
  else if(a==='simch'){sim.ch=v;render()}
  else if(a==='sev'){sevF=v;render()}
  else if(a==='fch'){FORM.ch=v;render()}
  else if(a==='formreset'){FORM={...FORM,date:'2024-12-31',qty:1,ncName:''};ferr={};lastAdded=null;render()}
  else if(a==='addorder'){e.preventDefault();addOrder()}
  else if(a==='del'){delEntry(+v)}
  else if(a==='clearnew'){if(!clrArm){clrArm=true;render();setTimeout(()=>{clrArm=false;if(route.page==='add')render()},4000)}else{clrArm=false;for(let i=ORD.length-1;i>=0;i--)if(ORD[i].isNew)ORD.splice(i,1);for(let j=CUST.length-1;j>=0;j--)if(CUST[j].isNew&&!ORD.some(o=>o.cust===CUST[j].customer_id))CUST.splice(j,1);lastAdded=null;rebuild();saveEntries();render()}}
  else if(a==='csvnew'){const txt=csv(O.filter(o=>o.isNew));const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('CSV copied')}catch(_){toast('Copy blocked by browser')}ta.remove()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('CSV copied'),fb);else fb()}
  else if(a==='csv'){copyText(explorerCSV())}
  else if(a==='tab'){TAB=v;EDIT=null;armKey=null;render()}
  else if(a==='om'){OM=v==='all'?'all':+v;render()}
  else if(a==='addrow'){openEdit(TAB==='joined'?'orders':TAB,'add')}
  else if(a==='edit'){const [tb,k]=v.split('~');openEdit(tb,'edit',k)}
  else if(a==='rdel'){const [tb,k]=v.split('~'),kk=tb+'~'+k;if(armKey!==kk)arm(kk);else{armKey=null;rowDelete(tb,k)}}
  else if(a==='edclose'){EDIT=null;render()}
  else if(a==='sbcfg'){SB.state='config';SB.msg='';render()}
  else if(a==='sbcancel'){SB.state=sb?'signin':'off';render()}
  else if(a==='sbin'){SB.msg='';cloudInit()}
  else if(a==='sbreload'){if(sb&&SB.user)cloudLoad();else cloudInit()}
  else if(a==='sbout'){(async()=>{try{await sb.auth.signOut()}catch(_){}SB.user='';SB.state='signin';SB.msg='';render()})()}
  else if(a==='sboff'){SB.state='offline';render()}
  else if(a==='sbup'){syncCloud()}
  else if(a==='resetdata'){if(armKey!=='resetdata')arm('resetdata');else{armKey=null;loadData(JSON.parse(ORIG));rebuild();saveEntries();lastAdded=null;OM='all';F.q='';Object.keys(XQ).forEach(k=>XQ[k]='');toast('Original Excel data restored');render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(EDIT){EDIT=null;render()}else if(insOpen){insOpen=false;render()}}});
document.addEventListener('submit',e=>{if(e.target.id==='addform'){e.preventDefault();addOrder()}else if(e.target.id==='edform'){e.preventDefault();saveEdit()}else if(e.target.id==='authform'){e.preventDefault();doSignIn(e.target)}else if(e.target.id==='cfgform'){e.preventDefault();doConfig(e.target)}});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(EDIT&&e.target.dataset&&e.target.dataset.ef!==undefined&&e.target.tagName!=='SELECT'){const f=e.target.dataset.ef;if(f.startsWith('d:'))EDIT.v.disc[f.slice(2)]=e.target.value;else EDIT.v[f]=e.target.value;const p=$('#edprev');if(p)p.innerHTML=edPreview();return}
  if(e.target.dataset&&e.target.dataset.fld&&e.target.tagName!=='SELECT'){FORM[e.target.dataset.fld]=e.target.value;const pv=$('#prev');if(pv)pv.innerHTML=previewHTML();return}
  if(id==='simcap'||id==='simvol'){if(id==='simcap'){sim.cap=+e.target.value;$('#simcapv').textContent=sim.cap+'%'}else{sim.vol=+e.target.value;$('#simvolv').textContent=(sim.vol>0?'+':'')+sim.vol+'%'}$('#simout').innerHTML=simOut(R().filter(o=>o.ch===sim.ch))}
  if(id==='q'){setQ(e.target.value);const p=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{
  if(EDIT&&e.target.dataset&&e.target.dataset.ef!==undefined&&e.target.tagName==='SELECT'){EDIT.v[e.target.dataset.ef]=e.target.value;EDIT.err={};fixEdit();const id=e.target.id;render();const n=$('#'+id);if(n)n.focus();return}
  if(e.target.id==='ssel'){const [c,d]=e.target.value.split(':');if(c){sortS.col=c;sortS.dir=+d;render()}return}
  if(e.target.dataset&&e.target.dataset.fld&&e.target.tagName==='SELECT'){FORM[e.target.dataset.fld]=e.target.value;if(e.target.dataset.fld==='cat')FORM.prod='';ferr={};const id=e.target.id;render();const n=$('#'+id);if(n)n.focus();return}if(e.target.id==='m0'||e.target.id==='m1'){F[e.target.id]=+e.target.value;if(F.m0>F.m1){if(e.target.id==='m0')F.m1=F.m0;else F.m0=F.m1}render()}});
parseHash();render(false);cloudInit();
</script></body></html>
